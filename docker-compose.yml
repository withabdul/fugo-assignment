services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fugo
      POSTGRES_PASSWORD: fugo
      POSTGRES_DB: fugo
    ports:
      # 5433 on the host, so it does not clash with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fugo -d fugo"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://fugo:fugo@db:5432/fugo
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env next to this file}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-4-hydrogen}
      GEMINI_DECISION_MODEL: ${GEMINI_DECISION_MODEL:-gemini-decision-1}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fugo.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env next to this file}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env next to this file}

volumes:
  pgdata:
